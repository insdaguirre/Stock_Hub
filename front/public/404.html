<!doctype html>
<html>
  <head>
    <meta http-equiv="refresh" content="0; url=./" />
    <script>
      (function () {
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        var basePath = segments.length ? '/' + segments[0] + '/' : '/';
        var routeSegments = segments.length > 1 ? segments.slice(1) : [];
        var routePath = routeSegments.length ? '/' + routeSegments.join('/') : '/';
        l.replace(basePath + '#' + routePath + l.search + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
